[package]
name = "switch-use"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Let AI agents drive a real Nintendo Switch (Atmosphère + sys-botbase): on-screen text via OCR, tap by label, wait for screens, buttons, sticks, touch, typing and screenshots over the LAN."
repository = "https://github.com/leeguooooo/switch-use"
homepage = "https://github.com/leeguooooo/switch-use"
readme = "README.md"
keywords = ["nintendo-switch", "sys-botbase", "automation", "ai-agent", "ocr"]
categories = ["command-line-utilities", "games"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError", "NSObject"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNRequestHandler", "VNRequest", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "VNDefines"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
