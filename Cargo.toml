[package]
name = "switch-use"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Drive a homebrew Nintendo Switch from the command line or an agent: buttons, sticks, touch, typing and screenshots over sys-botbase."
repository = "https://github.com/leeguooooo/switch-use"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
